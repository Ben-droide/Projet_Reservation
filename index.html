<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaPro | Portfolio & Gestion Privée</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4361ee; --success: #2ec4b6; --danger: #e71d36;
            --dark: #2b2d42; --light: #f8f9fa; --bg-body: #f0f2f5;
            --bg-card: #ffffff; --text-main: #2b2d42; --text-sub: #666; --border: #ddd;
        }

        body.dark-mode {
            --bg-body: #121212; --bg-card: #1e1e1e; --text-main: #f8f9fa;
            --text-sub: #bbb; --border: #333; --light: #2b2d42;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; transition: 0.3s; }

        nav { background: var(--dark); display: flex; justify-content: center; padding: 10px; position: sticky; top: 0; z-index: 1000; gap: 5px; }
        nav button { background: transparent; border: none; color: white; padding: 10px 15px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        nav button.active { border-bottom: 3px solid var(--primary); color: var(--primary); }
        #btn-admin { color: #ffbe0b; border: 1px solid #ffbe0b; border-radius: 20px; margin-left: 10px; }

        header { background-color: var(--dark); color: white; padding: 20px 0; text-align: center; position: relative; }
        #themeToggle { position: absolute; right: 20px; top: 25px; background: transparent; border: 1.5px solid white; color: white; padding: 5px 12px; border-radius: 20px; cursor: pointer; }

        .container { width: 95%; max-width: 1000px; margin: 20px auto; display: none; gap: 20px; }
        .container.active { display: grid; }

        @media (min-width: 850px) {
            #booking-section.active { grid-template-columns: 400px 1fr; align-items: start; }
        }

        .card, .list-container { background: var(--bg-card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; }

        /* --- VISIBILITÉ ADMIN --- */
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: block !important; }
        body.is-admin .admin-inline { display: inline-block !important; }

        .input-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-main); font-family: 'Poppins'; }
        .btn-valider { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 600; }

        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .portfolio-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1; background: #ddd; }
        .portfolio-item img { width: 100%; height: 100%; object-fit: cover; }
        .btn-del { position: absolute; top: 5px; right: 5px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }

        .res-item { background: var(--light); padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary); }
        .counter-badge { background: var(--primary); color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

<nav>
    <button onclick="switchTab('booking')" id="btn-booking" class="active">RDV</button>
    <button onclick="switchTab('portfolio')" id="btn-portfolio">Portfolio</button>
    <button onclick="switchTab('contact')" id="btn-contact">Contact</button>
    <button onclick="handleLogin()" id="btn-admin"><i class="fa-solid fa-lock"></i> Login</button>
</nav>

<header>
    <h1>ReservaPro</h1>
    <button id="themeToggle"><i class="fa-solid fa-moon"></i></button>
</header>

<div id="booking-section" class="container active">
    <div class="card">
        <h3>Réserver un soin</h3>
        <form id="reservationForm">
            <div class="input-group"><input type="text" id="name" placeholder="Votre nom complet" required></div>
            <div class="input-group">
                <select id="service">
                    <option value="Coupe Classique">Coupe Classique</option>
                    <option value="Taille de Barbe">Taille de Barbe</option>
                    <option value="Soin Complet">Soin Complet</option>
                </select>
            </div>
            <div class="input-group">
                <input type="date" id="date" required style="margin-bottom:10px">
                <select id="time">
                    <option value="09:00">09:00</option><option value="10:00">10:00</option>
                    <option value="14:00">14:00</option><option value="16:00">16:00</option>
                </select>
            </div>
            <button type="submit" class="btn-valider">Confirmer le RDV</button>
        </form>
        <div id="successMsg" style="display:none; color:var(--success); margin-top:15px; text-align:center; font-weight:600;">
            ✅ RDV enregistré ! Le rappel est téléchargé.
        </div>
    </div>

    <div class="list-container admin-only">
        <h3>Liste des clients <span id="resCounter" class="counter-badge">0</span></h3>
        <div id="reservationList"></div>
    </div>
</div>

<div id="portfolio-section" class="container">
    <div class="card" style="text-align: center;">
        <h3>Galerie Photos</h3>
        <label for="imageInput" class="admin-inline" style="display:none; background:var(--success); color:white; padding:10px 20px; border-radius:20px; cursor:pointer; margin-bottom:20px;">
            <i class="fa-solid fa-plus"></i> Ajouter une photo
        </label>
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        <div id="portfolioGrid" class="portfolio-grid"></div>
    </div>
</div>

<div id="contact-section" class="container">
    <div class="card">
        <h3>Nous trouver</h3>
        <p><i class="fa-solid fa-phone"></i> 01 23 45 67 89</p>
        <p><i class="fa-solid fa-location-dot"></i> 123 Rue de la Coiffure, Paris</p>
    </div>
    <div class="card" style="padding:0; overflow:hidden; height:300px;">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.9916256937595!2d2.2922926156743895!3d48.85837007928746!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66e2964e34e2d%3A0x8ddca97e440e2941!2sTour%20Eiffel!5e0!3m2!1sfr!2sfr!4v1647441530000!5m2!1sfr!2sfr" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
</div>

<script>
    let isAdmin = false;
    const HASH_ADMIN = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"; // admin123

    async function hashPassword(str) {
        const utf8 = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin() {
        if (!isAdmin) {
            const p = prompt("Mot de passe :");
            if (await hashPassword(p) === HASH_ADMIN) {
                isAdmin = true;
                document.body.classList.add('is-admin');
                document.getElementById('btn-admin').innerHTML = '<i class="fa-solid fa-unlock"></i> Déconnexion';
            } else { alert("Erreur"); }
        } else {
            isAdmin = false;
            document.body.classList.remove('is-admin');
            document.getElementById('btn-admin').innerHTML = '<i class="fa-solid fa-lock"></i> Login';
        }
        displayReservations(); displayPortfolio();
    }

    function switchTab(t) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(t + '-section').classList.add('active');
        document.getElementById('btn-' + t).classList.add('active');
    }

    // GENERATION CALENDRIER
    function downloadICS(n, s, d, t) {
        const dateICS = d.replace(/-/g, '');
        const timeICS = t.replace(':', '') + '00';
        const content = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${dateICS}T${timeICS}\nSUMMARY:RDV ${s}\nDESCRIPTION:Rendez-vous pour ${n}\nEND:VEVENT\nEND:VCALENDAR`;
        const blob = new Blob([content], { type: 'text/calendar' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = "mon_rdv.ics";
        link.click();
    }

    const form = document.getElementById('reservationForm');
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const n = document.getElementById('name').value, s = document.getElementById('service').value, d = document.getElementById('date').value, t = document.getElementById('time').value;
        const all = JSON.parse(localStorage.getItem('mesReservations')) || [];
        all.push({ id: Date.now(), name: n, service: s, date: d, time: t });
        localStorage.setItem('mesReservations', JSON.stringify(all));
        
        downloadICS(n, s, d, t);
        window.location.href = `mailto:?subject=Confirmation RDV&body=Bonjour ${n}, votre RDV est confirmé pour le ${d} à ${t}.`;
        
        document.getElementById('successMsg').style.display = 'block';
        setTimeout(() => document.getElementById('successMsg').style.display = 'none', 5000);
        form.reset(); displayReservations();
    });

    function displayReservations() {
        const all = JSON.parse(localStorage.getItem('mesReservations')) || [];
        document.getElementById('resCounter').textContent = all.length;
        document.getElementById('reservationList').innerHTML = all.map(res => `
            <div class="res-item">
                <div><strong>${res.name}</strong><br><small>${res.service} - ${res.date} @ ${res.time}</small></div>
                <button class="btn-del" onclick="deleteRes(${res.id})">×</button>
            </div>
        `).join('');
    }

    function deleteRes(id) {
        let all = JSON.parse(localStorage.getItem('mesReservations')) || [];
        localStorage.setItem('mesReservations', JSON.stringify(all.filter(r => r.id !== id)));
        displayReservations();
    }

    document.getElementById('imageInput').addEventListener('change', function() {
        const reader = new FileReader();
        reader.onload = (e) => {
            const imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
            imgs.push(e.target.result);
            localStorage.setItem('mesPhotos', JSON.stringify(imgs));
            displayPortfolio();
        };
        reader.readAsDataURL(this.files[0]);
    });

    function displayPortfolio() {
        const imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
        document.getElementById('portfolioGrid').innerHTML = imgs.map((img, i) => `
            <div class="portfolio-item"><img src="${img}">${isAdmin ? `<button class="btn-del" onclick="deleteImg(${i})">×</button>` : ''}</div>
        `).join('');
    }

    function deleteImg(i) {
        let imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
        imgs.splice(i, 1);
        localStorage.setItem('mesPhotos', JSON.stringify(imgs));
        displayPortfolio();
    }

    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));
    window.onload = () => { displayReservations(); displayPortfolio(); };
</script>
</body>
</html>
