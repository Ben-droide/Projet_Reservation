<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaPro | Gestion Multi-Services</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4361ee; --success: #2ec4b6; --danger: #e71d36;
            --dark: #2b2d42; --light: #f8f9fa; --bg-body: #f0f2f5;
            --bg-card: #ffffff; --text-main: #2b2d42; --text-sub: #666; --border: #ddd;
        }

        body.dark-mode {
            --bg-body: #121212; --bg-card: #1e1e1e; --text-main: #f8f9fa;
            --text-sub: #bbb; --border: #333; --light: #2b2d42;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; transition: 0.3s; overflow-x: hidden; }

        nav { background: var(--dark); display: flex; justify-content: center; padding: 10px; position: sticky; top: 0; z-index: 1000; gap: 5px; }
        nav button { background: transparent; border: none; color: white; padding: 10px 15px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        nav button.active { border-bottom: 3px solid var(--primary); color: var(--primary); }
        #btn-admin { color: #ffbe0b; border: 1px solid #ffbe0b; border-radius: 20px; margin-left: 10px; }

        header { background-color: var(--dark); color: white; padding: 20px 0; text-align: center; position: relative; }
        #themeToggle { position: absolute; right: 20px; top: 25px; background: transparent; border: 1.5px solid white; color: white; padding: 5px 12px; border-radius: 20px; cursor: pointer; }

        .container { width: 95%; max-width: 1000px; margin: 20px auto; display: none; gap: 20px; }
        .container.active { display: block; }

        .card { background: var(--bg-card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; margin-bottom: 20px; }

        /* --- CALENDLY CONTAINER --- */
        .calendly-card { padding: 0; overflow: hidden; min-height: 750px; }

        /* --- ADMIN --- */
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: block !important; }

        /* --- PORTFOLIO --- */
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .portfolio-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1; background: #ddd; }
        .portfolio-item img { width: 100%; height: 100%; object-fit: cover; }
        .btn-del { position: absolute; top: 5px; right: 5px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }

        .contact-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .contact-grid { grid-template-columns: 1fr 1fr; } }
        .map-container { border-radius: 16px; overflow: hidden; height: 300px; border: 1.5px solid var(--border); }
    </style>
</head>
<body>

<nav>
    <button onclick="switchTab('booking')" id="btn-booking" class="active">Réservations</button>
    <button onclick="switchTab('portfolio')" id="btn-portfolio">Portfolio</button>
    <button onclick="switchTab('contact')" id="btn-contact">Contact</button>
    <button onclick="handleLogin()" id="btn-admin"><i class="fa-solid fa-lock"></i> Login</button>
</nav>

<header>
    <h1>ReservaPro</h1>
    <button id="themeToggle"><i class="fa-solid fa-moon"></i></button>
</header>

<div id="booking-section" class="container active">
    <div class="card" style="text-align: center; margin-bottom: 10px;">
        <h3>Prendre rendez-vous</h3>
        <p style="font-size: 0.9rem; color: var(--text-sub);">Sélectionnez le service de votre choix ci-dessous.</p>
    </div>
    <div class="card calendly-card">
        <div class="calendly-inline-widget" 
             data-url="https://calendly.com/benoitrenaux1999?hide_gdpr_banner=1&primary_color=4361ee" 
             style="min-width:320px;height:750px;"></div>
        <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
    </div>
</div>

<div id="portfolio-section" class="container">
    <div class="card" style="text-align: center;">
        <h3>Galerie Réalisations</h3>
        <label for="imageInput" class="admin-only" style="background:var(--success); color:white; padding:10px 20px; border-radius:20px; cursor:pointer; margin-bottom:20px; display:inline-block;">
            <i class="fa-solid fa-plus"></i> Ajouter une photo
        </label>
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        <div id="portfolioGrid" class="portfolio-grid"></div>
    </div>
</div>

<div id="contact-section" class="container">
    <div class="contact-grid">
        <div class="card">
            <h3>Nos Coordonnées</h3>
            <p><i class="fa-solid fa-phone" style="color:var(--primary)"></i> 01 23 45 67 89</p>
            <p><i class="fa-solid fa-location-dot" style="color:var(--primary)"></i> 123 Rue de la Coiffure, Paris</p>
            <div style="margin-top: 20px;">
                <a href="#" style="font-size: 1.5rem; margin-right: 15px; color: var(--primary);"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" style="font-size: 1.5rem; color: var(--primary);"><i class="fa-brands fa-tiktok"></i></a>
            </div>
        </div>
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.9916256937595!2d2.2922926156633!3d48.85837007928746!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66e2964e34e2d%3A0x8ddca979a7166707!2sTour%20Eiffel!5e0!3m2!1sfr!2sfr!4v1625123456789!5m2!1sfr!2sfr" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>
</div>

<script>
    let isAdmin = false;
    const HASH_ADMIN = "240be518fabd2724ddb6f04e959c122650cbc5e3e709689b022f392ad345c093"; // admin123

    async function hashPassword(str) {
        const utf8 = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin() {
        if (!isAdmin) {
            const p = prompt("Accès Admin - Mot de passe :");
            if (await hashPassword(p) === HASH_ADMIN) {
                isAdmin = true;
                document.body.classList.add('is-admin');
                document.getElementById('btn-admin').innerHTML = '<i class="fa-solid fa-unlock"></i> Logout';
                displayPortfolio();
            } else { alert("Accès refusé"); }
        } else {
            isAdmin = false;
            document.body.classList.remove('is-admin');
            document.getElementById('btn-admin').innerHTML = '<i class="fa-solid fa-lock"></i> Login';
            displayPortfolio();
        }
    }

    function switchTab(t) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(t + '-section').classList.add('active');
        document.getElementById('btn-' + t).classList.add('active');
    }

    document.getElementById('imageInput').addEventListener('change', function() {
        const reader = new FileReader();
        reader.onload = (e) => {
            const imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
            imgs.push(e.target.result);
            localStorage.setItem('mesPhotos', JSON.stringify(imgs));
            displayPortfolio();
        };
        reader.readAsDataURL(this.files[0]);
    });

    function displayPortfolio() {
        const imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
        document.getElementById('portfolioGrid').innerHTML = imgs.map((img, i) => `
            <div class="portfolio-item"><img src="${img}">${isAdmin ? `<button class="btn-del" onclick="deleteImg(${i})">×</button>` : ''}</div>
        `).join('');
    }

    function deleteImg(i) {
        let imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
        imgs.splice(i, 1);
        localStorage.setItem('mesPhotos', JSON.stringify(imgs));
        displayPortfolio();
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document.getElementById('themeToggle').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    });

    window.onload = () => { displayPortfolio(); };
</script>
</body>
</html>
