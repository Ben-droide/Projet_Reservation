<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaPro | Portfolio & Contact</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --danger: #e71d36;
            --dark: #2b2d42;
            --light: #f8f9fa;
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #2b2d42;
            --text-sub: #666;
            --border: #ddd;
        }

        body.dark-mode {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f8f9fa;
            --text-sub: #bbb;
            --border: #333;
            --light: #2b2d42;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; transition: 0.3s; }

        /* --- NAVIGATION --- */
        nav {
            background: var(--dark);
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            padding: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav button {
            background: transparent;
            border: none;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        nav button.active { border-bottom: 3px solid var(--primary); color: var(--primary); }

        header { background-color: var(--dark); color: white; padding: 20px 0; text-align: center; position: relative; }
        #themeToggle { position: absolute; right: 20px; top: 25px; background: transparent; border: 1.5px solid white; color: white; padding: 5px 12px; border-radius: 20px; cursor: pointer; }

        .container { width: 95%; max-width: 1000px; margin: 20px auto; display: none; gap: 20px; }
        .container.active { display: grid; }

        @media (min-width: 850px) {
            #booking-section.active { grid-template-columns: 400px 1fr; align-items: start; }
            #contact-section.active { grid-template-columns: 1fr 1fr; }
        }

        .card, .list-container { background: var(--bg-card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; }

        /* --- FORMULAIRES --- */
        .input-group { margin-bottom: 15px; }
        .input-with-icon { position: relative; width: 100%; }
        .input-with-icon i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--primary); pointer-events: none; }
        input, select { width: 100%; padding: 12px 12px 12px 40px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-main); font-family: 'Poppins'; }
        .btn-valider { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 600; }

        /* --- CONTACT & MAP --- */
        .contact-info { list-style: none; padding: 0; }
        .contact-info li { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; font-size: 1.1rem; }
        .contact-info i { color: var(--primary); font-size: 1.4rem; width: 30px; text-align: center; }
        .social-links { display: flex; gap: 15px; margin-top: 20px; justify-content: center; }
        .social-links a { font-size: 1.5rem; color: var(--primary); transition: 0.3s; }
        .map-container { border-radius: 16px; overflow: hidden; height: 300px; border: 1.5px solid var(--border); }
        iframe { width: 100%; height: 100%; border: 0; }

        /* --- PORTFOLIO --- */
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .portfolio-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1; background: #ddd; }
        .portfolio-item img { width: 100%; height: 100%; object-fit: cover; }
        .btn-del-img { position: absolute; top: 5px; right: 5px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }
        .upload-label { background: var(--success); color: white; padding: 12px 25px; border-radius: 30px; cursor: pointer; display: inline-block; font-weight: 600; margin-bottom: 20px; }
        #imageInput { display: none; }

        .res-item { background: var(--light); padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .counter-badge { background: var(--primary); color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; margin-left: 10px; }
    </style>
</head>
<body>

<nav>
    <button onclick="switchTab('booking')" id="btn-booking" class="active"><i class="fa-solid fa-calendar"></i> RDV</button>
    <button onclick="switchTab('portfolio')" id="btn-portfolio"><i class="fa-solid fa-camera"></i> Portfolio</button>
    <button onclick="switchTab('contact')" id="btn-contact"><i class="fa-solid fa-map-location-dot"></i> Contact</button>
</nav>

<header>
    <h1>ReservaPro</h1>
    <button id="themeToggle"><i class="fa-solid fa-moon"></i></button>
</header>

<div id="booking-section" class="container active">
    <div class="card">
        <h3>Prendre RDV</h3>
        <form id="reservationForm">
            <div class="input-group">
                <div class="input-with-icon">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="name" placeholder="Nom" required>
                </div>
            </div>
            <div class="input-group">
                <div class="input-with-icon">
                    <i class="fa-solid fa-scissors"></i>
                    <select id="service">
                        <option value="Coupe">Coupe Classique</option>
                        <option value="Barbe">Barbe</option>
                        <option value="Soin">Soin Complet</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <div class="input-with-icon" style="margin-bottom:10px">
                    <i class="fa-solid fa-calendar-day"></i>
                    <input type="date" id="date" required>
                </div>
                <div class="input-with-icon">
                    <i class="fa-solid fa-clock"></i>
                    <select id="time">
                        <option value="09:00">09:00</option>
                        <option value="10:00">10:00</option>
                        <option value="14:00">14:00</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-valider">Réserver</button>
        </form>
    </div>
    <div class="list-container">
        <h3>Mes RDV <span id="resCounter" class="counter-badge">0</span></h3>
        <div id="statusMessage" style="text-align:center; font-size:0.8rem; margin-bottom:10px"></div>
        <div id="reservationList"></div>
    </div>
</div>

<div id="portfolio-section" class="container">
    <div class="card" style="text-align: center;">
        <h3>Galerie Photos</h3>
        <label for="imageInput" class="upload-label"><i class="fa-solid fa-plus"></i> Ajouter</label>
        <input type="file" id="imageInput" accept="image/*">
        <div id="portfolioGrid" class="portfolio-grid"></div>
    </div>
</div>

<div id="contact-section" class="container">
    <div class="card">
        <h3>Coordonnées</h3>
        <ul class="contact-info">
            <li><i class="fa-solid fa-phone"></i> 01 23 45 67 89</li>
            <li><i class="fa-solid fa-envelope"></i> contact@reservapro.fr</li>
            <li><i class="fa-solid fa-location-dot"></i> 123 Rue de la Coiffure, Paris</li>
        </ul>
        <div class="social-links">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
        </div>
    </div>
    <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.9916256937595!2d2.292292615672323!3d48.85837007928746!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66e2964e34e2d%3A0x8ddca97e141270!2sTour%20Eiffel!5e0!3m2!1sfr!2sfr!4v1619524000000!5m2!1sfr!2sfr"></iframe>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tab + '-section').classList.add('active');
        document.getElementById('btn-' + tab).classList.add('active');
    }

    // --- LOGIQUE RÉSERVATION ---
    const form = document.getElementById('reservationForm');
    window.onload = () => { displayReservations(); displayPortfolio(); };

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const allRes = JSON.parse(localStorage.getItem('mesReservations')) || [];
        const res = { id: Date.now(), name: document.getElementById('name').value, service: document.getElementById('service').value, date: document.getElementById('date').value, time: document.getElementById('time').value };
        allRes.push(res);
        localStorage.setItem('mesReservations', JSON.stringify(allRes));
        form.reset();
        displayReservations();
    });

    function displayReservations() {
        const allRes = JSON.parse(localStorage.getItem('mesReservations')) || [];
        document.getElementById('resCounter').textContent = allRes.length;
        document.getElementById('reservationList').innerHTML = allRes.map(res => `
            <div class="res-item">
                <div><strong>${res.name}</strong><br><small>${res.service} - ${res.date} @ ${res.time}</small></div>
                <button onclick="deleteRes(${res.id})" style="color:var(--danger); border:none; background:none; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
            </div>
        `).join('');
    }

    function deleteRes(id) {
        let allRes = JSON.parse(localStorage.getItem('mesReservations')) || [];
        localStorage.setItem('mesReservations', JSON.stringify(allRes.filter(r => r.id !== id)));
        displayReservations();
    }

    // --- LOGIQUE PORTFOLIO ---
    document.getElementById('imageInput').addEventListener('change', function() {
        const reader = new FileReader();
        reader.onload = (e) => {
            const imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
            imgs.push(e.target.result);
            localStorage.setItem('mesPhotos', JSON.stringify(imgs));
            displayPortfolio();
        };
        reader.readAsDataURL(this.files[0]);
    });

    function displayPortfolio() {
        const imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
        document.getElementById('portfolioGrid').innerHTML = imgs.map((img, i) => `
            <div class="portfolio-item"><img src="${img}"><button class="btn-del-img" onclick="deleteImg(${i})">&times;</button></div>
        `).join('');
    }

    function deleteImg(i) {
        let imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
        imgs.splice(i, 1);
        localStorage.setItem('mesPhotos', JSON.stringify(imgs));
        displayPortfolio();
    }

    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));
</script>
</body>
</html>
