<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaPro | Portfolio & Calendrier</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --danger: #e71d36;
            --dark: #2b2d42;
            --light: #f8f9fa;
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #2b2d42;
            --text-sub: #666;
            --border: #ddd;
        }

        body.dark-mode {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f8f9fa;
            --text-sub: #bbb;
            --border: #333;
            --light: #2b2d42;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; transition: 0.3s; }

        /* --- NAVIGATION --- */
        nav {
            background: var(--dark);
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            padding: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav button {
            background: transparent;
            border: none;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
        }

        nav button.active { border-bottom: 3px solid var(--primary); color: var(--primary); }
        #btn-admin { color: #ffbe0b; border: 1px solid #ffbe0b; border-radius: 20px; margin-left: 10px; }
        #btn-admin.logged { background: #ffbe0b; color: var(--dark); }

        header { background-color: var(--dark); color: white; padding: 20px 0; text-align: center; position: relative; }
        #themeToggle { position: absolute; right: 20px; top: 25px; background: transparent; border: 1.5px solid white; color: white; padding: 5px 12px; border-radius: 20px; cursor: pointer; }

        .container { width: 95%; max-width: 1000px; margin: 20px auto; display: none; gap: 20px; }
        .container.active { display: grid; }

        @media (min-width: 850px) {
            #booking-section.active { grid-template-columns: 400px 1fr; align-items: start; }
            #contact-section.active { grid-template-columns: 1fr 1fr; }
        }

        .card, .list-container { background: var(--bg-card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; }

        /* --- INPUTS --- */
        .input-group { margin-bottom: 15px; }
        .input-with-icon { position: relative; width: 100%; }
        .input-with-icon i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--primary); pointer-events: none; }
        input, select { width: 100%; padding: 12px 12px 12px 40px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-main); font-family: 'Poppins'; }
        
        .btn-valider { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 600; transition: 0.3s; }

        /* --- PORTFOLIO & CONTACT --- */
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .portfolio-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1; background: #ddd; }
        .portfolio-item img { width: 100%; height: 100%; object-fit: cover; }
        .btn-del-img { position: absolute; top: 5px; right: 5px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }
        .admin-only { display: none; } 
        body.is-admin .admin-only { display: inline-block; }
        
        .contact-info { list-style: none; padding: 0; }
        .contact-info li { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .map-container { border-radius: 16px; overflow: hidden; height: 300px; border: 1.5px solid var(--border); }
        iframe { width: 100%; height: 100%; border: 0; }

        .res-item { background: var(--light); padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .counter-badge { background: var(--primary); color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; margin-left: 10px; }
    </style>
</head>
<body>

<nav>
    <button onclick="switchTab('booking')" id="btn-booking" class="active">RDV</button>
    <button onclick="switchTab('portfolio')" id="btn-portfolio">Portfolio</button>
    <button onclick="switchTab('contact')" id="btn-contact">Contact</button>
    <button onclick="handleLogin()" id="btn-admin"><i class="fa-solid fa-lock"></i> Login</button>
</nav>

<header>
    <h1>ReservaPro</h1>
    <button id="themeToggle"><i class="fa-solid fa-moon"></i></button>
</header>

<div id="booking-section" class="container active">
    <div class="card">
        <h3>Prendre RDV</h3>
        <p style="font-size: 0.8rem; color: var(--text-sub);">Un fichier calendrier (.ics) sera généré automatiquement.</p>
        <form id="reservationForm">
            <div class="input-group"><div class="input-with-icon"><i class="fa-solid fa-user"></i><input type="text" id="name" placeholder="Nom" required></div></div>
            <div class="input-group"><div class="input-with-icon"><i class="fa-solid fa-scissors"></i><select id="service"><option value="Coupe">Coupe</option><option value="Barbe">Barbe</option><option value="Soin">Soin</option></select></div></div>
            <div class="input-group">
                <input type="date" id="date" required style="margin-bottom: 10px; padding-left: 15px;">
                <select id="time" style="padding-left: 15px;"><option value="09:00">09:00</option><option value="14:00">14:00</option></select>
            </div>
            <button type="submit" class="btn-valider">Confirmer & Télécharger rappel</button>
        </form>
    </div>
    <div class="list-container">
        <h3>Mes RDV <span id="resCounter" class="counter-badge">0</span></h3>
        <div id="reservationList"></div>
    </div>
</div>

<div id="portfolio-section" class="container">
    <div class="card" style="text-align: center;">
        <h3>Galerie Photos</h3>
        <label for="imageInput" class="upload-label admin-only" style="background:var(--success); color:white; padding:10px 20px; border-radius:20px; cursor:pointer;">Ajouter</label>
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        <div id="portfolioGrid" class="portfolio-grid"></div>
    </div>
</div>

<div id="contact-section" class="container">
    <div class="card">
        <h3>Coordonnées</h3>
        <ul class="contact-info">
            <li><i class="fa-solid fa-phone"></i> 01 23 45 67 89</li>
            <li><i class="fa-solid fa-location-dot"></i> 123 Rue de la Coiffure, Paris</li>
        </ul>
    </div>
    <div class="map-container"><iframe src="https://maps.google.com/maps/contrib/104509143844387395980"></iframe></div>
</div>

<script>
    // --- SECURITE SHA-256 ---
    let isAdmin = false;
    const HASH_ADMIN = "240be518fabd2724ddb6f04e959c122650cbc5e3e709689b022f392ad345c093";

    async function hashPassword(string) {
        const utf8 = new TextEncoder().encode(string);
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin() {
        if (!isAdmin) {
            const pass = prompt("Password admin :");
            if (await hashPassword(pass) === HASH_ADMIN) {
                isAdmin = true;
                document.body.classList.add('is-admin');
                document.getElementById('btn-admin').innerHTML = "Admin OK";
            } else { alert("Nop."); }
        } else {
            isAdmin = false;
            document.body.classList.remove('is-admin');
            document.getElementById('btn-admin').innerHTML = "Login";
        }
        displayReservations(); displayPortfolio();
    }

    // --- GENERATEUR ICS (CALENDRIER) ---
    function downloadICS(name, service, date, time) {
        const dateICS = date.replace(/-/g, '');
        const timeICS = time.replace(':', '') + '00';
        const icsContent = [
            "BEGIN:VCALENDAR", "VERSION:2.0", "BEGIN:VEVENT",
            `DTSTART:${dateICS}T${timeICS}`,
            `SUMMARY:RDV ${service} - ReservaPro`,
            `DESCRIPTION:Rendez-vous pour ${name}`,
            "END:VEVENT", "END:VCALENDAR"
        ].join("\n");

        const blob = new Blob([icsContent], { type: 'text/calendar' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = "rappel_rdv.ics";
        link.click();
    }

    // --- LOGIQUE INTERFACE ---
    function switchTab(tab) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById(tab + '-section').classList.add('active');
    }

    const form = document.getElementById('reservationForm');
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const n = document.getElementById('name').value;
        const s = document.getElementById('service').value;
        const d = document.getElementById('date').value;
        const t = document.getElementById('time').value;

        const all = JSON.parse(localStorage.getItem('mesReservations')) || [];
        all.push({ id: Date.now(), name: n, service: s, date: d, time: t });
        localStorage.setItem('mesReservations', JSON.stringify(all));

        // 1. Telechargement ICS
        downloadICS(n, s, d, t);
        
        // 2. Mailto
        window.location.href = `mailto:?subject=Confirmation RDV&body=Salut ${n}, ton RDV ${s} est le ${d} à ${t}.`;

        form.reset(); displayReservations();
    });

    function displayReservations() {
        const all = JSON.parse(localStorage.getItem('mesReservations')) || [];
        document.getElementById('resCounter').textContent = all.length;
        document.getElementById('reservationList').innerHTML = all.map(res => `
            <div class="res-item">
                <div><strong>${res.name}</strong><br><small>${res.service} - ${res.date}</small></div>
                ${isAdmin ? `<button onclick="deleteRes(${res.id})">🗑️</button>` : ''}
            </div>
        `).join('');
    }

    function deleteRes(id) {
        let all = JSON.parse(localStorage.getItem('mesReservations')) || [];
        localStorage.setItem('mesReservations', JSON.stringify(all.filter(r => r.id !== id)));
        displayReservations();
    }

    function displayPortfolio() {
        const imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
        document.getElementById('portfolioGrid').innerHTML = imgs.map((img, i) => `
            <div class="portfolio-item"><img src="${img}">${isAdmin ? `<button onclick="deleteImg(${i})">×</button>` : ''}</div>
        `).join('');
    }

    document.getElementById('imageInput').addEventListener('change', function() {
        const r = new FileReader();
        r.onload = (e) => {
            const imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
            imgs.push(e.target.result);
            localStorage.setItem('mesPhotos', JSON.stringify(imgs));
            displayPortfolio();
        };
        r.readAsDataURL(this.files[0]);
    });

    function deleteImg(i) {
        let imgs = JSON.parse(localStorage.getItem('mesPhotos')) || [];
        imgs.splice(i, 1);
        localStorage.setItem('mesPhotos', JSON.stringify(imgs));
        displayPortfolio();
    }

    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));
    window.onload = () => { displayReservations(); displayPortfolio(); };
</script>
</body>
</html>
